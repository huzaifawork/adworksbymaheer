<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adworks by Maheer | 360° Marketing & Outdoor Solutions</title>
    <meta name="description" content="Your One-Stop Marketing Solution. Adworks by Maheer brings Strategy, Creative, Digital Performance, Content Creation, and 250+ Owned Outdoor Hoarding inventory together under one roof." />
    <meta name="keywords" content="Marketing Agency, 360 Marketing Pakistan, Outdoor Hoardings, Billboards, Digital Marketing, Meta Ads, Google Ads, Branding, Content Creation, Adworks by Maheer" />
    <meta name="theme-color" content="#080708" />
    <link rel="canonical" href="https://adworksbymaheer.com/" />

    <!-- OpenGraph SEO. Crawlers do not resolve relative URLs, so the image
         must be absolute or link previews show up blank. -->
    <meta property="og:site_name" content="Adworks by Maheer" />
    <meta property="og:title" content="Adworks by Maheer | 360° Marketing & Growth Solutions" />
    <meta property="og:description" content="Your One-Stop Marketing Solution. Integrated Strategy, Branding, Performance Marketing, and 250+ Outdoor Hoardings." />
    <meta property="og:url" content="https://adworksbymaheer.com/" />
    <meta property="og:image" content="https://adworksbymaheer.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adworks by Maheer | 360° Marketing & Growth Solutions" />
    <meta name="twitter:description" content="Integrated Strategy, Branding, Performance Marketing, and 250+ Owned Outdoor Hoardings across Pakistan." />
    <meta name="twitter:image" content="https://adworksbymaheer.com/og-image.jpg" />

    <!-- The backdrop is the first thing painted behind the hero; start it
         before the CSS that references it has even been parsed. -->
    <link rel="preload" as="image" href="/bgimage/bgimage.webp" type="image/webp" media="(min-aspect-ratio: 3/4)" />
    <link rel="preload" as="image" href="/bgimage/bgimage-portrait.webp" type="image/webp" media="(max-aspect-ratio: 3/4)" />

    <!-- Google Fonts: only the weights actually used. The italic axis is not
         requested - one pull-quote gets synthetic oblique instead of doubling
         the font payload. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black text-white antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
